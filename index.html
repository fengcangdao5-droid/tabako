<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喫煙所マップ</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="style.css">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #map {
            height: 100vh;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .bottom-left-btn {
            position: relative !important;
            bottom: auto !important;
            left: auto !important;
            margin: 0 !important;
            padding: 10px 15px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            cursor: pointer;
            font-weight: bold;
            text-align: left;
            background: white;
            border: 1px solid #ccc;
            color: #333;
        }
    </style>
</head>
<body>

    <!-- 画面左下のボタン群（中止ボタン ＋ カウンターボタン ＋ 各種モーダルボタン） -->
    <div style="position: absolute; bottom: 20px; left: 10px; z-index: 1000; display: flex; flex-direction: column; gap: 12px;">
        <!-- ルート案内中のみ表示される中止ボタン -->
        <button id="cancel-route-btn" class="bottom-left-btn" onclick="clearRoute()" style="display: none; background-color: #e74c3c; color: white; border: none;">🛑 ルート案内を中止</button>
        
        <button id="count-btn" class="bottom-left-btn" onclick="addCigaretteCount()" style="background: #e74c3c; color: white; border: none; font-size: 14px;">
            🚬 +1本吸った (<span id="today-count-btn">0</span>本)
        </button>
        <button id="log-btn" class="bottom-left-btn" onclick="toggleLogModal()">
            📊 喫煙ログを見る
        </button>
        <button id="fav-btn" class="bottom-left-btn" onclick="toggleFavModal()">⭐ 保存した場所</button>
        <button id="brand-btn" class="bottom-left-btn" onclick="toggleBrandModal()">🚬 お気に入り銘柄一覧</button>
        <button id="add-pin-btn" class="bottom-left-btn" onclick="toggleAddPinMode()">
        📍 新規喫煙所をマップに打つ
    </button>
    </div>

    <!-- 保存した場所モーダル -->
    <div id="fav-modal" class="modal">
        
        <div class="modal-content">
            <span class="close-btn" onclick="toggleFavModal()">&times;</span>
            <h2>⭐ 保存した場所</h2>
            <div id="fav-list-container"></div>
        </div>
    </div>

    <!-- お気に入り銘柄一覧モーダル -->
    <div id="brand-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="toggleBrandModal()">&times;</span>
            
            <h2>🚬 お気に入り銘柄一覧</h2>
            
            <div style="background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: left;">
                <h3 style="margin-top: 0; color: #333;">新しいお気に入り銘柄登録</h3>
                <input type="text" id="new-brand-name" placeholder="銘柄名（必須）" style="width:90%; padding:8px; margin-bottom:5px; border: 1px solid #ccc; border-radius: 4px;"><br>
                <input type="text" id="new-brand-company" placeholder="メーカー名" style="width:90%; padding:8px; margin-bottom:5px; border: 1px solid #ccc; border-radius: 4px;"><br>
                <input type="text" id="new-brand-price" placeholder="価格（半角数字のみ 例: 600）" style="width:90%; padding:8px; margin-bottom:5px; border: 1px solid #ccc; border-radius: 4px;"><br>
                <input type="text" id="new-brand-desc" placeholder="特徴・説明" style="width:90%; padding:8px; margin-bottom:10px; border: 1px solid #ccc; border-radius: 4px;"><br>
                <button onclick="addBrand()" style="padding: 8px 20px; cursor: pointer; background: #27ae60; color: white; border: none; border-radius: 4px; font-weight: bold;">銘柄を追加する</button>
            </div>

            <div id="brand-list-container" style="text-align: left;"></div>
        </div>
    </div>

    <!-- 喫煙ログモーダル -->
    <div id="log-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="toggleLogModal()">&times;</span>
            <h2>🚬 喫煙ログ・管理</h2>
            
            <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 15px;">
                <p style="margin: 0; color: #666; font-size: 14px;">本日の喫煙本数</p>
                <p style="margin: 5px 0 0 0; font-size: 32px; font-weight: bold; color: #e74c3c;">
                    <span id="today-count-modal">0</span> <span style="font-size: 16px;">本</span>
                </p>
                <div style="margin-top: 10px; display: flex; justify-content: center; gap: 10px;">
                    <button onclick="addCigaretteCount()" style="padding: 6px 12px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">+1本追加</button>
                    <button onclick="removeCigaretteCount()" style="padding: 6px 12px; background: #95a5a6; color: white; border: none; border-radius: 4px; cursor: pointer;">1本減らす</button>
                </div>
            </div>

            <h3 style="text-align: left; margin-bottom: 10px;">📅 過去の記録</h3>
            <div id="log-list-container" style="text-align: left;"></div>
        </div>
    </div>

    <!-- 到着通知用モーダル -->
    <div id="arrival-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 2000; justify-content: center; align-items: center;">
        <div style="background: white; padding: 20px; border-radius: 12px; width: 85%; max-width: 320px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
            <h3 style="margin-top: 0; color: #27ae60;">🎉 到着しました！</h3>
            <p style="font-size: 14px; color: #444; margin-bottom: 20px;">目的地周辺（20m圏内）に接近しました。<br>ルート案内を終了しますか？</p>
            <div style="display: flex; gap: 10px;">
                <button onclick="dismissArrivalModal()" style="flex: 1; padding: 10px; border: 1px solid #ccc; background: #f8f9fa; border-radius: 6px; cursor: pointer;">継続する</button>
                <button onclick="confirmArrivalFinish()" style="flex: 1; padding: 10px; border: none; background: #e74c3c; color: white; font-weight: bold; border-radius: 6px; cursor: pointer;">ルート消去</button>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/lrm-localization.js"></script> 
    <script src="script.js"></script> 
</body>
</html>
